modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/gokublack/crown/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Crown registers no packets, items, blocks or entities and runs server-side only (spec 2.3),
# so a client on the same pack must never be version-blocked by a Crown hotfix.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"

[[dependencies.${mod_id}]]
modId = "luckperms"
type = "optional"
versionRange = "[5.4,)"
ordering = "AFTER"
